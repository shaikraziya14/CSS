<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Questions</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.10);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }

        h1 {
            color: #ffffff;
            font-size: 38px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        h1 span {
            background: linear-gradient(90deg, #ffb347, #ffcc33);
            color: #252525;
            padding: 12px 25px;
            border-radius: 12px;
            display: inline-block;
        }

        h3 {
            color: #ffd166;
            font-size: 23px;
            margin-bottom: 20px;
        }

        p {
            color: #f1f5f9;
            font-size: 18px;
            line-height: 1.9;
            margin-bottom: 20px;
        }

        .highlight {
            color: #80ed99;
            font-weight: bold;
        }

        .line {
            width: 90px;
            height: 4px;
            background: #ffb347;
            margin: 0 auto 25px;
            border-radius: 10px;
        }

        .footer {
            color: #cbd5e1;
            font-size: 14px;
            margin-top: 25px;
        }

        .css-icon {
            width: 90px;
            height: 90px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            h3 {
                font-size: 19px;
            }

            p {
                font-size: 16px;
            }

            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1><span>CSS Questions</span></h1>

        <div class="line"></div>

        <h3>What is CSS, and why is it used?</h3>

        <p>
            <span class="highlight">CSS</span> stands for
            <span class="highlight">Cascading Style Sheets.</span>
            It controls the visual presentation, layout, colours,
            fonts, spacing, and design of HTML documents
            across different screen sizes.
        </p>

        <img class="css-icon" src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/css3/css3-original.svg"
            alt="CSS3 logo">

        <div class="footer">
            ✨ Learn HTML & CSS | Create Beautiful Websites ✨
        </div>

    </div>

</body>

</html>
