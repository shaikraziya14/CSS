<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 16px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #dce8df, #f8efdf 55%, #e8e1ef);
            color: #314338;
            font-family: Georgia, "Times New Roman", serif;
        }

        .invitation {
            width: min(100%, 620px);
            padding: 18px;
            border: 1px solid #c9ad72;
           background: #f2dfa5;
            box-shadow: 0 18px 50px #30402d24;
        }

        .inner {
            padding: 42px 28px;
            border: 1px solid #e6dcc4;
            text-align: center;
            background-color: #ba0a0adb;

        }

        .monogram {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border: 1px solid #c9ad72;
            border-radius: 50%;
            color: #9a7a3d;
            font-size: 19px;
        }

        .eyebrow {
            color: #9a7a3d;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        h1 {
            margin: 18px 0 10px;
            color: #314338;
            font-size: clamp(36px, 8vw, 54px);
            font-weight: normal;
        }

        .message {
            margin: 18px auto;
            color: #549554;
            font-size: 16px;
            line-height: 1.8;
        }

        .names {
            width: min(100%, 420px);
            min-height: 150px;
            margin: 28px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            align-items: center;
            color: #9a7a3d;
            font-size: clamp(24px, 6vw, 38px);
            font-style: italic;
        }

        .name-left {
            grid-column: 1;
            grid-row: 1;
            justify-self: end;
        }

        .ampersand {
            grid-column: 1 / -1;
            grid-row: 2;
            justify-self: center;
        }

        .name-right {
            grid-column: 2;
            grid-row: 3;
            justify-self: start;
        }

        .divider {
            width: 65px;
            height: 1px;
            margin: 25px auto;
            background: #c9ad72;
        }

        .details {
            margin-top: 24px;
            color: #314338;
            font-family: Arial, sans-serif;
            line-height: 1.8;
        }

        .details strong {
            display: block;
            color: #9a7a3d;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .footer {
            margin-top: 32px;
            color: #687568;
            font-size: 14px;
            font-style: italic;
        }

        .download-actions {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .download-actions button {
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            background: #314338;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .invitation { padding: 10px; }
            .inner { padding: 34px 18px; }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 15mm;
            }

            body {
                min-height: auto;
                padding: 0;
                background: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .download-actions {
                display: none;
            }

            .invitation {
                width: 100%;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <main class="invitation">
        <div class="inner">
            <div class="monogram" aria-hidden="true">A &amp; M</div>
            <div class="eyebrow">Together with our families</div>

            <h1>Wedding Invitation</h1>

            <p class="message">
                We joyfully invite you to celebrate the beginning
                of our forever.
            </p>

            <div class="names">
                <span class="name-left">Magbul</span>
                <span class="ampersand">&amp;</span>
                <span class="name-right">Gousiya</span>
            </div>

            <div class="divider"></div>

            <div class="details">
                <strong>Date &amp; Time</strong>
                Saturday, 20 December 2026<br>
                6:00 in the evening
            </div>

            <div class="details">
                <strong>Venue</strong>
                The Garden Hall<br>
                Hyderabad
            </div>

            <p class="footer">Your presence will make our day complete</p>
        </div>
    </main>
    <div class="download-actions">
        <button id="download-image" type="button">Download Image</button>
        <button type="button" onclick="window.print()">Download PDF</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        document.getElementById("download-image").addEventListener("click", async () => {
            try {
                const canvas = await html2canvas(document.querySelector(".invitation"), {
                    scale: 2,
                    backgroundColor: null
                });

                const link = document.createElement("a");
                link.download = "wedding-invitation.png";
                link.href = canvas.toDataURL("image/png");
                link.click();
            } catch (error) {
                alert("Could not create the image. Please try again.");
                console.error(error);
            }
        });
    </script>
</body>
</html>
